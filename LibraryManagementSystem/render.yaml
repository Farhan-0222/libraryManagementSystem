services:
  - type: web
    name: library-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./LibraryManagementSystem/Dockerfile
    dockerContext: ./LibraryManagementSystem
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
